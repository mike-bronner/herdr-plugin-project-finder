[package]
name = "pick-project"
version = "0.9.2"
edition = "2021"
license = "MIT"
description = "Fuzzy-pick git repos and open them as Herdr workspaces"
repository = "https://github.com/mike-bronner/herdr-plugin-project-finder"

[lib]
name = "pick_project"
path = "src/lib.rs"

# [package] declares no `rust-version`, deliberately. The 1.75 it used to carry
# was false twice over: the kit's generated types need `LazyLock` from 1.80, and
# `regress`, which the kit pulls in, declares `edition = "2024"` and so needs
# 1.85. The second is what binds. A floor is a promise to people who compile
# this, and nobody has to: the plugin installs a published binary. See
# herdr-plugin-kit SCOPE.md §11.8.1.

[[bin]]
name = "pick-project"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
# Pinned by tag, and the same tag the release workflow calls. A crate pin and a
# CI pin that disagree check this plugin against one kit and build it against
# another, and nothing in the gates compares the two.
herdr-plugin-kit = { git = "https://github.com/mike-bronner/herdr-plugin-kit", tag = "0.4.1" }
nucleo = "0.5.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = "0.8"

# Build-only, and it must stay that way. The stamp helper runs once during the
# build and belongs in no shipped binary, which is why the kit ships it as a
# second crate that depends on nothing.
[build-dependencies]
herdr-plugin-kit-build = { git = "https://github.com/mike-bronner/herdr-plugin-kit", tag = "0.4.1" }

[dev-dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
strip = true
