[package]
name = "pick-project"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Fuzzy-pick git repos and open them as Herdr workspaces"
repository = "https://github.com/mike-bronner/herdr-plugin-project-finder"

[lib]
name = "pick_project"
path = "src/lib.rs"

[[bin]]
name = "pick-project"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
nucleo = "0.5.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
strip = true
