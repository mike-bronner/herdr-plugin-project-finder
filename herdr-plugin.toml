id = "mikebronner.project-picker"
name = "Project Picker"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Fuzzy-pick git repos and open them as workspaces"
platforms = ["macos", "linux"]

# Fuzzy-pick a git repo under ~/Developer and open it as a workspace.
[[actions]]
id = "pick-project"
title = "Pick project"
contexts = ["workspace"]
command = ["python3", "bin/pick-project"]
