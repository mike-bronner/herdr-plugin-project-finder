id = "mikebronner.project-picker"
name = "Project Picker"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Fuzzy-pick git repos and open them as workspaces"
platforms = ["macos", "linux"]

# Fuzzy-pick a git repo under the configured root and open it as a workspace.
# A popup pane, not an action: actions run headless with no TTY, and fzf needs one.
[[panes]]
id = "picker"
title = "Pick project"
placement = "popup"
width = "85%"
height = "85%"
command = ["python3", "bin/pick-project"]
