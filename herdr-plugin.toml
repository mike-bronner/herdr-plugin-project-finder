id = "mikebronner.project-finder"
name = "Project Finder"
version = "0.9.4"
min_herdr_version = "0.9.0"
description = "Fuzzy-pick git repos and open them as workspaces"

# Windows is declared, and it is untested.
#
# ⚠️ It was absent for a measured reason, and it is back for a decided one, so
# both are worth a reader's time. The measurement: on 2026-09-12 this crate
# would not compile for either Windows target, because src/layout.rs reached
# for `std::os::unix::fs::PermissionsExt` and
# `std::os::unix::process::CommandExt`. The decision, Mike's: port those two
# rather than narrow the release matrix or ship untagged, so that all six
# targets compile and a release can actually publish. `cargo clippy` is clean
# for all six as of that port.
#
# 🚨 Compiling is the whole of the guarantee. No Windows machine has ever run
# this plugin, no .ps1 file here has been run or even parsed, and the layout
# hand-off detaches by a different mechanism there (see the README's Windows
# section for what that does and does not promise). Treat a bug on Windows as
# new information rather than as a regression.
platforms = ["macos", "linux", "windows"]

# Every [[build]] and [[startup]] entry is declared twice, because `["sh", ...]`
# cannot run on Windows and `["powershell", ...]` cannot run anywhere else.
# Herdr supports per-item `platforms` that override the top-level list, which is
# what makes one manifest serve both. [[panes]] is the one exception, and the
# reason it is an exception is measured rather than assumed — see the note above
# the pane itself.
#
# 🔑 The `sh` entry comes first in every pair, deliberately. Whether Herdr
# filters a build or a startup step by platform before it runs one is not
# something anyone here has verified; if it ever took the first entry
# regardless, the platforms that are actually tested are the ones that would
# win.

# Getting the binary: fetch the one published for this platform, and compile
# only when no verified binary can be had. Installing therefore needs no Rust
# toolchain.
#
# 🔑 `--install` names the calling *context*, not the action. [[build]] fires
# only during `herdr plugin install owner/repo` — measured as not running on
# plugin link, on enable, or on a server restart — so the install is `github`
# by construction here, and the shim asks Herdr what kind of install it is only
# on the startup path.
[[build]]
command = ["sh", "bin/build", "--install"]
platforms = ["macos", "linux"]

[[build]]
command = ["powershell", "-File", "bin/build.ps1", "--install"]
platforms = ["windows"]

# The same shim with no flag, so a linked checkout that has been pulled is
# rebuilt when the server starts. Without the flag it asks Herdr what kind of
# install this is, and a local working tree compiles rather than fetching a
# binary built from somebody else's commit.
[[startup]]
command = ["sh", "bin/build"]
platforms = ["macos", "linux"]

[[startup]]
command = ["powershell", "-File", "bin/build.ps1"]
platforms = ["windows"]

# The pane runs the shim, never the build artifact. bin/launcher rebuilds when
# the source is newer than the binary and then execs it, so a `git pull` cannot
# leave the old picker running, and a path under target/ would break the moment
# the profile changed.
#
# 🚨 One entry, and `platforms` is absent on purpose: on a pane that key does
# not do what it does on a build step. ✅ Measured against a live Herdr 0.9.0 on
# 2026-09-13: two [[panes]] entries that share the id `picker` are refused even
# when their `platforms` lists are disjoint. A pane id has to be unique across
# every entry, whatever `platforms` says, and that is what makes the doubling
# above legal and the same doubling here fatal. 0.9.0 shipped the opposite
# reading, that `platforms` filters first, and so it did not load at all:
# `manifest unavailable: duplicate pane id 'picker'`. Herdr served its cached
# 0.3.1 manifest instead, whose pane ran `bin/pick-project` under Python, a file
# 0.9.0 itself had deleted. The keybinding opened nothing until 0.9.1.
#
# ⚠️ Two distinct ids would load, and were weighed and rejected: the keybinding
# is one line naming `--entrypoint picker`, and a second id makes it
# platform-dependent for a platform nobody here can test. So this pane runs `sh`
# everywhere, and `prefix+f` on Windows will not work. No Windows machine has
# ever run this plugin; bin/launcher.ps1 stays in the tree for the day one does.
[[panes]]
id = "picker"
title = "Find projects to work on"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "bin/launcher"]

# The update offer's dialog. herdr-plugin-kit opens it as a popup under the id
# `dialog`, which the kit fixes, and this pane draws it and writes the answer
# back. It is a second pane under a distinct id, so the one-id rule above is
# not in play: the picker keeps `picker`, and the keybinding still names it.
[[panes]]
id = "dialog"
title = "Project Finder update"
placement = "popup"
width = "60%"
height = "40%"
command = ["sh", "bin/launcher", "--dialog"]
