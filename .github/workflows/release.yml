name: Release

# Builds the six targets on native runners and publishes a raw binary plus a
# checksum for each, named exactly as the synced bin/build asks for them:
#
#     releases/download/<version>/pick-project-<platform>-<first 12 of the commit>
#
# 🔑 Nothing about the build lives here. The whole job is herdr-plugin-kit's
# reusable plugin-release.yml, pinned to the tag Cargo.toml pins. A copy of it
# in this file would be a second opinion about a convention that is already
# written down, and the consuming half — asset_url in bin/common — has no way
# to disagree out loud: a producer and a consumer that name an asset
# differently is a 404, a silent fall back to compiling, and nobody finding out.
#
# 🚨 The `@` ref and Cargo.toml's two `tag =` pins have to name the same kit.
# The kit's release job checks that with `plugin_gate.py kit-pins`, but only
# after a tag exists. tests/packaging.rs checks it on every push, before that.
#
# ⚠️ The tag carries no `v`. The kit's version gate refuses the other form by
# name, which is what stops the two conventions crossing at the one place that
# publishes. Tags up to v0.7.0 keep their prefix and are not rewritten.

on:
  release:
    types: [created]

# Read by default. The one grant below is the one the called workflow needs,
# and it is here rather than at the top of the file so that a job added later
# does not inherit the ability to publish.
permissions:
  contents: read

jobs:
  release:
    uses: mike-bronner/herdr-plugin-kit/.github/workflows/plugin-release.yml@0.5.2
    # 🚨 Required. A called workflow runs on the caller's permissions and
    # cannot raise its own, so without this the run fails before it starts.
    permissions:
      contents: write
